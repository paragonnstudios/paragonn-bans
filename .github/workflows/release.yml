name: Release

on:
  push:
    branches:
      - master
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Roda em todo push na main: abre/atualiza a PR de release. So publica release ao mergear essa PR.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Release Please outputs (for debugging)
        if: always()
        run: |
          echo "release_created=${{ steps.release.outputs.release_created }}"
          echo "releases_created=${{ steps.release.outputs.releases_created }}"
          echo "tag_name=${{ steps.release.outputs.tag_name }}"

  # Roda so quando este workflow publica release no MESMO run (merge da PR de release no push).
  # Em pushes normais (ex.: fix:, feat:) release_created fica false — esperado; o job e skipped.
  build-and-upload:
    if: >-
      github.event_name == 'push' &&
      (needs.release-please.outputs.release_created == 'true' ||
       needs.release-please.outputs.releases_created == 'true')
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      # Gradle 8.x exige JVM 17+ para o daemon; o bytecode do plugin segue Java 8 (toolchain no build.gradle).
      # org.spigotmc:spigot:1.8.8-R0.1-SNAPSHOT (jar completo, com NMS) saiu do ar no
      # repositorio publico do SpigotMC -- geramos e instalamos localmente via BuildTools,
      # cacheado por hash pra nao recompilar em toda run (~3-5min sem cache).
      - name: Cache Spigot 1.8.8 (BuildTools)
        id: spigot-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/spigotmc
          key: spigot-1.8.8-buildtools-v1

      - name: Set up Java 8 (para o BuildTools)
        if: steps.spigot-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build Spigot 1.8.8 via BuildTools
        if: steps.spigot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/buildtools && cd /tmp/buildtools
          curl -o BuildTools.jar -L https://hub.spigotmc.org/jenkins/job/BuildTools/lastStableBuild/artifact/target/BuildTools.jar
          java -jar BuildTools.jar --rev 1.8.8 --compile spigot

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build jar
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VER="${TAG#v}"
          chmod +x ./gradlew
          ./gradlew clean jar -PreleaseVersion="$VER"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: build/libs/paragonn-bans.jar

  # Quando uma release e publicada, sobe o jar (PAT dispara este evento; --clobber evita erro se ja existir asset).
  build-and-upload-on-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      # org.spigotmc:spigot:1.8.8-R0.1-SNAPSHOT (jar completo, com NMS) saiu do ar no
      # repositorio publico do SpigotMC -- geramos e instalamos localmente via BuildTools,
      # cacheado por hash pra nao recompilar em toda run (~3-5min sem cache).
      - name: Cache Spigot 1.8.8 (BuildTools)
        id: spigot-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/spigotmc
          key: spigot-1.8.8-buildtools-v1

      - name: Set up Java 8 (para o BuildTools)
        if: steps.spigot-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build Spigot 1.8.8 via BuildTools
        if: steps.spigot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/buildtools && cd /tmp/buildtools
          curl -o BuildTools.jar -L https://hub.spigotmc.org/jenkins/job/BuildTools/lastStableBuild/artifact/target/BuildTools.jar
          java -jar BuildTools.jar --rev 1.8.8 --compile spigot

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build jar
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VER="${TAG#v}"
          chmod +x ./gradlew
          ./gradlew clean jar -PreleaseVersion="$VER"

      - name: Upload jar to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          build/libs/paragonn-bans.jar
          --clobber
