plugins {
    id 'java'
    id 'idea'
}

// --- Lógica de Versão ---
def normalizeVersion(raw) {
    if (!raw) return null
    def s = raw.toString().trim()
    if (s.startsWith('refs/tags/')) s = s.substring(10).trim()
    if (s.toLowerCase().startsWith('v')) s = s.substring(1).trim()
    return s ?: null
}

def resolveProjectVersion() {
    def v = providers.gradleProperty('releaseVersion')
            .orElse(providers.environmentVariable('RELEASE_VERSION'))
            .orElse(providers.environmentVariable('GITHUB_REF'))
            .orNull

    if (v) {
        def norm = normalizeVersion(v)
        if (norm) return norm
    }

    def manifestFile = layout.projectDirectory.file('.release-please-manifest.json').asFile
    if (manifestFile.exists()) {
        def text = manifestFile.text
        def matcher = (text =~ /"\.":\s*"([^"]+)"/)
        if (matcher.find()) {
            return matcher.group(1).trim()
        }
    }
    return '0.0.0-SNAPSHOT'
}

group = 'studios.paragonn'
version = resolveProjectVersion()

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'spigot-repo'
        url = uri('https://hub.spigotmc.org/nexus/content/groups/public/')
    }
}

dependencies {
    compileOnly 'org.spigotmc:spigot:1.8.8-R0.1-SNAPSHOT'

    // Dependencias locais opcionais mantidas para compatibilidade.
    if (file('libs/Herochat.jar').exists()) {
        compileOnly files('libs/Herochat.jar')
    }
    if (file('libs/DynamicBan.jar').exists()) {
        compileOnly files('libs/DynamicBan.jar')
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}

jar {
    archiveBaseName = 'paragonn-bans'
    archiveVersion = ''
}

processResources {
    def props = [version: version]
    inputs.properties props
    filesMatching('plugin.yml') {
        expand props
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
